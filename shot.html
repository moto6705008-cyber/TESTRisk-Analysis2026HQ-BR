<!DOCTYPE html>

<style>
*{box-sizing:border-box}body{margin:0;font-family:'IBM Plex Sans Thai','Sarabun',system-ui,sans-serif;background:#eef1f6;color:#1e293b;font-size:15px}
.hd{background:#1e2761;color:#fff;padding:14px 16px 12px}.hd b{font-size:17px}.hd .s{font-size:13px;opacity:.85;margin-top:3px;line-height:1.5}
.bar{height:8px;background:#e2e8f0;border-radius:6px;margin:8px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:#ea580c;transition:width .3s}
.wrap{padding:12px}.box{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;margin-bottom:10px}
.it{display:flex;gap:10px;align-items:center;border:1px solid #e2e8f0;border-radius:12px;padding:10px;margin:8px 0;background:#fff}
.it.on{border:2px solid #ea580c}.it.ok{background:#f0fdf4;border-color:#86efac}
.ic{font-size:26px;width:34px;text-align:center}.tx{flex:1;line-height:1.4}.tx small{display:block;color:#64748b;font-size:12.5px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;font-family:inherit}
.b-o{background:#ea580c;color:#fff}.b-g{background:#e2e8f0;color:#334155}.b-ok{background:#15803d;color:#fff}
.tag{white-space:nowrap;display:inline-block;border-radius:7px;padding:2px 7px;font-size:11.5px;font-weight:700}.req{background:#fff1e6;color:#c2410c}.opt{background:#f1f5f9;color:#475569}
.gps{font-size:13px;padding:8px 10px;border-radius:10px;margin-bottom:8px}.g-ok{background:#dcfce7;color:#166534}.g-wt{background:#fef3c7;color:#92400e}.g-bad{background:#fee2e2;color:#991b1b}
.err{background:#fee2e2;color:#991b1b;border-radius:12px;padding:14px;line-height:1.6}
.mut{color:#64748b;font-size:12.5px}.thumb{width:54px;height:54px;object-fit:cover;border-radius:8px}
#ov{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:9}#ov div{background:#fff;border-radius:14px;padding:18px 20px;max-width:86%;text-align:center;line-height:1.6}
/* รุ่น 4: ภาพย่อ · ดูเต็มจอ · ลบ/เลิกทำ */
.it.dn{display:block}.dn .row{display:flex;gap:10px;align-items:flex-start}.dn .acts{display:flex;gap:8px;margin-top:8px}.dn .acts .btn{flex:1;padding:9px 8px}
.pv{width:112px;height:84px;flex:none;border-radius:9px;background:#e2e8f0 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:11.5px;border:0;padding:0}
.b-rd{background:#fff;color:#dc2626;border:1.5px solid #fca5a5}
#vw{position:fixed;inset:0;background:#0b0f19;z-index:8;display:none;flex-direction:column;color:#fff}
#vw .vt{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:14px}
#vw .vi{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:0 8px}#vw .vi img{max-width:100%;max-height:100%;touch-action:pinch-zoom}
#vw .vm{font-size:12.5px;opacity:.8;padding:8px 14px 0}#vw .vb{display:flex;gap:8px;padding:12px}#vw .vb .btn{flex:1;padding:13px 8px}
#cf{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:flex-end}#cf>div{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px}
#cf .cb{display:flex;gap:8px;margin-top:12px}#cf .cb .btn{flex:1;padding:13px 8px}
#ts{position:fixed;left:12px;right:12px;bottom:16px;background:#111827;color:#fff;border-radius:12px;padding:12px 14px;display:none;justify-content:space-between;align-items:center;z-index:11;font-size:14px}#ts u{color:#fdba74;text-decoration:none;font-weight:700;padding:4px 6px}
#rv{position:fixed;inset:0;background:#0b0f19;z-index:12;display:none;flex-direction:column;color:#fff}
#rv .vt{padding:12px 14px;font-size:15px;text-align:center}#rv .vi{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:0 8px}#rv .vi img{max-width:100%;max-height:100%}
#rv .ck{margin:8px 12px 0;background:#1c2333;border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.6}#rv .vb{display:flex;gap:8px;padding:12px}#rv .vb .btn{flex:1;padding:14px 8px;font-size:15px}
#fin{position:fixed;inset:0;background:#f0fdf4;z-index:7;display:none;flex-direction:column;align-items:center;padding:28px 18px;overflow:auto;text-align:center}
#fin .big{font-size:56px;line-height:1}#fin h2{margin:10px 0 4px;color:#166534}#fin .ls{background:#fff;border:1px solid #bbf7d0;border-radius:14px;padding:6px 14px;margin:14px 0;width:100%;max-width:420px;text-align:left}
#fin .ls div{padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:14px}#fin .ls div:last-child{border:0}#fin .btn{width:100%;max-width:420px;padding:14px;font-size:15px;margin-top:8px}
.whb{border:2px solid;border-radius:16px;margin:12px 0;overflow:hidden}.whh{display:flex;align-items:center;gap:8px;padding:9px 12px;color:#fff}.whh b{font-size:16px}.whc{margin-left:auto;background:#fff;border-radius:99px;padding:1px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}.whi{padding:0 9px 6px}
</style></head><body>
<div class="hd"><b>📷 ถ่ายภาพหน้างาน</b><div class="s" id="hs">กำลังโหลด…</div><div class="bar"><i id="pg" style="width:0"></i></div><div class="s" id="hc"></div></div>
<div class="wrap"><div id="gps" class="gps g-wt">📍 กำลังหาตำแหน่ง GPS…</div><div id="main"></div>
<div class="mut" style="text-align:center;margin:14px 0 30px">ถ่ายจากกล้องเท่านั้น · ระบบบันทึกพิกัดและเวลาตอนถ่าย · ภาพเข้าระบบ MOTO24 อัตโนมัติ</div></div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
<div id="ov"><div id="ovt"></div></div>
<div id="vw"><div class="vt"><span onclick="vwClose()" style="padding:4px 6px">‹ กลับ</span><b id="vwt"></b><span style="width:40px"></span></div><div class="vi" id="vwi"></div><div class="vm" id="vwm"></div><div class="vb" id="vwb"></div></div>
<div id="cf"><div><b id="cft" style="font-size:16px"></b><div class="mut" style="margin-top:4px;font-size:13.5px">รายการนี้จะกลับเป็น "ยังไม่ถ่าย" และต้องถ่ายใหม่ก่อนส่งคำขอ</div><div class="cb"><button class="btn b-g" onclick="cfClose()">ไม่ลบ</button><button class="btn" style="background:#dc2626;color:#fff" onclick="delGo()">ลบ</button></div></div></div>
<div id="rv"><div class="vt"><b id="rvt"></b><div class="mut" style="color:#cbd5e1">ตรวจภาพก่อนส่ง · ยังไม่ได้ส่งเข้าระบบ</div></div><div class="vi" id="rvi"></div><div class="ck" id="rvc"></div>
<div class="vb"><button class="btn b-rd" onclick="rvPick('retake')">🗑 ลบ ถ่ายใหม่</button><button class="btn b-ok" onclick="rvPick('use')">✓ ใช้ภาพนี้</button></div>
<div style="text-align:center;padding:0 0 12px"><span onclick="rvPick('cancel')" class="mut" style="color:#94a3b8;padding:6px 12px">ยกเลิก (ไม่ส่งภาพนี้)</span></div></div>
<div id="fin"><div class="big">✅</div><h2>ถ่ายภาพเสร็จสิ้นแล้ว</h2><div class="mut" id="fint" style="font-size:14px;line-height:1.6"></div><div class="ls" id="finl"></div>
<div class="mut" style="font-size:13.5px;line-height:1.6" id="finn"></div><button class="btn b-g" onclick="finClose()">← กลับไปแก้ไขภาพ</button></div>
<div id="ts"><span id="tst"></span><u onclick="delUndo()">เลิกทำ (<span id="tsn">5</span>)</u></div>
<script>
/* ตั้งค่าตอนติดตั้ง: ใส่ Web app URL ของ Apps Script "MOTO24 P2Photo" */
const API='https://script.google.com/macros/s/AKfycbxxhUbrlM_6sbUYzR2xzSmbufhTN43q3WND56atZzUybzOgCSonURs5wAOiTa_QyFiO/exec';
const ACC_MAX=50, MAX_W=1600, Q=0.82, FRESH_MS=5*60e3;
const T=new URLSearchParams(location.search).get('t')||'';
let D=null, pos=null, cur=null, tries={};
const TH={}, FULL={}; let PD=null, delP=null;   // รุ่น 4: ภาพย่อ/ภาพเต็มที่โหลดแล้ว · PD = รายการที่รอลบ (เลิกทำได้ 5 วิ)
const $=id=>document.getElementById(id), E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ov(t){ $('ovt').innerHTML=t; $('ov').style.display=t?'flex':'none'; }
async function call(o){ if(window.__mockApi) return window.__mockApi(o); const r=await fetch(API,{method:'POST',body:JSON.stringify(o)}); return r.json(); }
function fmtT(ms){ const d=new Date(ms); return d.toLocaleDateString('th-TH',{day:'numeric',month:'numeric'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
/* GPS: เปิดค้างไว้ตั้งแต่เข้าหน้า ให้แม่นขึ้นก่อนกดถ่าย */
function gpsStart(){ if(!navigator.geolocation){ gpsShow('bad','เครื่องนี้ไม่รองรับ GPS'); return; }
 navigator.geolocation.watchPosition(p=>{ pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy),t:Date.now()}; gpsShow(pos.acc<=ACC_MAX?'ok':'wt'); },
  e=>{ pos=null; gpsShow('bad',e.code===1?'ไม่ได้อนุญาตตำแหน่ง — กดอนุญาต "ตำแหน่ง" ให้เบราว์เซอร์ แล้วรีเฟรชหน้านี้':'หาตำแหน่งไม่ได้ — ออกไปที่โล่ง/เปิด GPS แล้วรอสักครู่'); },
  {enableHighAccuracy:true,maximumAge:0,timeout:30000}); }
function gpsShow(k,msg){ const g=$('gps'); g.className='gps '+(k==='ok'?'g-ok':k==='wt'?'g-wt':'g-bad');
 g.innerHTML=k==='ok'?'📍 GPS พร้อม (คลาดเคลื่อน ±'+pos.acc+' ม.)':k==='wt'?'📍 GPS ยังไม่แม่น (±'+(pos?pos.acc:'?')+' ม.) — รอสักครู่ หรือออกไปที่โล่ง':'⚠ '+E(msg); }
function labOf(x){ let l=String(x.lab||''); if(/^(home|selfie)$/.test(x.k)) l=l.replace(/^หน้าบ้าน/,'หน้าบ้านผู้ซื้อ').replace(/^ลูกค้าถ่ายคู่/,'ผู้ซื้อถ่ายคู่'); l=l.replace(/^🧑‍🔧\s*ผู้ค้ำ:\s*/,'ผู้ค้ำ: '); return l; }
function render(){ const it=D.items, done=D.done||{}; const need=it.filter(x=>x.req), ok=need.filter(x=>done[x.k]).length;
 $('hs').innerHTML=(String(D.caseId).charAt(0)==='~'?'<b>ร่างคำขอ (ยังไม่ส่ง สนญ.)</b>':'เคส <b>'+E(D.caseId)+'</b>')+' · '+E(D.info.name||'')+'<br>'+E(D.info.br||'')+' · อาชีพ: '+E(D.info.occ||'-');
 $('pg').style.width=(need.length?Math.round(ok*100/need.length):100)+'%';
 const left=D.exp-Date.now(); $('hc').innerHTML='ภาพบังคับ <b>'+ok+' / '+need.length+'</b> · ลิงก์ใช้ได้ถึง '+fmtT(D.exp)+' (เหลือ '+Math.max(0,Math.floor(left/3600e3))+' ชม.)';
 /* S1 (28 พ.ย. 69): แยกกล่องตาม "คน" — ผู้ซื้อ (น้ำเงิน) · ผู้ค้ำ (ม่วง) · ผู้ใช้รถ (เขียวอมฟ้า) · ในกล่องแบ่งย่อย บ้าน / อาชีพ-รายได้ · หัวกล่องมีตัวนับภาพบังคับ */
  const card=(x,multi)=>{ let h=''; const lab=multi?labOf(x):x.lab;
  const d=done[x.k], k=E(x.k);
  const head='<b>'+E(lab)+'</b> <span class="tag '+(x.req?'req">บังคับ':'opt">ถ้ามี')+'</span>'+(x.gps?' <span class="tag opt">📍 พิกัด</span>':'');
  if(d){ const t=TH[x.k]; h+='<div class="it ok dn" id="it-'+k+'"><div class="row"><button class="pv" onclick="vwOpen(\''+k+'\')" style="'+(t?'background-image:url('+t+')':'')+'">'+(t?'':(t===false?'แตะเพื่อโหลดภาพ':'⏳ กำลังโหลดภาพ'))+'</button>'
    +'<div class="tx">'+head+'<small style="color:#15803d">✓ ส่งแล้ว '+fmtT(d.at)+'</small>'+(d.code?'<small>รหัสภาพ '+E(d.code)+'</small>':'')+'<small>🔍 แตะภาพเพื่อดูใหญ่</small></div></div>'
    +'<div class="acts"><button class="btn b-g" onclick="shoot(\''+k+'\')">📷 ถ่ายใหม่</button>'+(D.canDel?'<button class="btn b-rd" onclick="cfOpen(\''+k+'\')">🗑 ลบ</button>':'')+'</div></div>'; }
  else h+='<div class="it" id="it-'+k+'"><div class="ic">'+E(x.ic||'📷')+'</div><div class="tx">'+head+(x.hint?'<small>'+E(x.hint)+'</small>':'')+'</div>'
   +'<button class="btn b-o" onclick="shoot(\''+k+'\')">📷 ถ่าย</button></div>'; return h; };
 const who=x=>/^g_/.test(x.k)||/^g/.test(x.pin||'')?'g':/^u_/.test(x.k)||/^u/.test(x.pin||'')?'u':'b';
 const sub=x=>/^(home|selfie|g_home|u_home)$/.test(x.k)||/^(home|ghome|uhome)$/.test(x.pin||'')||/^xp_/.test(x.k)?'h':'w';
 const P={b:['🧑','ผู้ซื้อ','#2563eb','#eff6ff'],g:['🤝','ผู้ค้ำประกัน','#7c3aed','#f5f3ff'],u:['🛵','ผู้ใช้รถ','#0d9488','#f0fdfa']};
 const ws=['b','g','u'].filter(w=>it.some(x=>who(x)===w)); const multi=ws.length>1; let h='';
 ws.forEach((w,wi)=>{ const L=it.filter(x=>who(x)===w); const rq=L.filter(x=>x.req), rd=rq.filter(x=>done[x.k]).length; const nm=P[w][1];
  const sh=(t,list)=>list.length?'<div style="font-weight:700;margin:10px 2px 0;font-size:14px;color:#334155">'+t+'</div>'+list.map(x=>card(x,multi)).join(''):'';
  const hs=L.filter(x=>sub(x)==='h'), ws2=L.filter(x=>sub(x)==='w');
  const inner=sh(w==='b'?(multi?'🏠 บ้านผู้ซื้อ':'👤 มิติบุคคล — บ้าน'):'🏠 บ้าน'+nm.replace('ประกัน',''),hs)+sh(w==='b'?(multi?'💼 อาชีพ / 💰 รายได้ของผู้ซื้อ':'💼 มิติอาชีพ / 💰 รายได้'):'💼 อาชีพ / ทรัพย์'+nm.replace('ประกัน',''),ws2);
  if(!multi){ h+=inner; return; }
  h+='<div class="whb" style="border-color:'+P[w][2]+';background:'+P[w][3]+'"><div class="whh" style="background:'+P[w][2]+'"><span style="font-size:22px">'+P[w][0]+'</span><div><b>ส่วนที่ '+(wi+1)+' · '+nm+'</b>'+(w==='b'&&D.info.name?'<div style="font-size:12px;opacity:.9">'+E(D.info.name)+'</div>':'')+'</div>'
   +(rq.length?'<span class="whc" style="color:'+P[w][2]+'">'+rd+'/'+rq.length+(rd===rq.length?' ✓':'')+'</span>':'<span class="whc" style="color:'+P[w][2]+'">ถ้ามี</span>')+'</div><div class="whi">'
   +(w!=='b'?'<div style="font-size:12.5px;color:'+P[w][2]+';margin:7px 2px 0">⚠ ถ่ายที่บ้าน/ที่ทำงาน<b>ของ'+nm.replace('ประกัน','')+'</b> ไม่ใช่ของผู้ซื้อ</div>':'')+inner+'</div></div>'; });
 const fs=D.fin?(D.chg>D.fin?'edit':'done'):'';
 if(fs==='done') h='<div class="box" style="background:#dcfce7;border-color:#86efac;color:#166534"><b>✅ คุณกดเสร็จสิ้นแล้ว '+fmtT(D.fin)+'</b><br><span style="font-size:13px">ภาพเข้าระบบครบ · แก้ภาพได้ถ้าจำเป็น (แก้แล้วต้องกดเสร็จสิ้นอีกครั้ง)</span></div>'+h;
 else if(fs==='edit') h='<div class="box" style="background:#fef3c7;border-color:#fcd34d;color:#92400e"><b>✏️ มีการแก้ภาพหลังกดเสร็จสิ้น</b><br><span style="font-size:13px">ตรวจภาพแล้วกด "เสร็จสิ้น" ด้านล่างอีกครั้งเพื่อยืนยันภาพชุดใหม่</span></div>'+h;
 if(ok===need.length&&need.length){ if(!fs) h='<div class="box" style="background:#dcfce7;border-color:#86efac;color:#166534"><b>✅ ภาพบังคับครบแล้ว</b> — ถ่ายภาพ "ถ้ามี" เพิ่มได้ · ตรวจภาพเรียบร้อยแล้วกด <b>เสร็จสิ้น</b> ด้านล่าง</div>'+h;
   h+='<button class="btn b-ok" style="width:100%;padding:15px;font-size:16px;margin-top:6px" onclick="finOpen()">✓ เสร็จสิ้น — '+(fs==='done'?'ดูสรุปอีกครั้ง':'ส่งภาพครบแล้ว')+'</button>'; }
 else if(need.length) h+='<button class="btn b-g" style="width:100%;padding:15px;font-size:15px;margin-top:6px;opacity:.6" onclick="alert(\'ยังขาดภาพบังคับ '+(need.length-ok)+' ภาพ — ถ่ายให้ครบก่อนกดเสร็จสิ้น\')">เสร็จสิ้น (ยังขาดภาพบังคับ '+(need.length-ok)+' ภาพ)</button>';
 $('main').innerHTML=h; }
function shoot(k){ if(PD&&PD.k===k) delP=delFlush(); cur=k; const x=D.items.find(y=>y.k===k); if(x&&x.gps&&!pos){ alert('ยังไม่ได้ตำแหน่ง GPS — เปิดตำแหน่งแล้วรอสักครู่'); return; } $('cam').value=''; $('cam').click(); }
$('cam').addEventListener('change',async ev=>{ const f=ev.target.files&&ev.target.files[0]; if(!f||!cur) return; const x=D.items.find(y=>y.k===cur); let flag=''; if(delP){ await delP; delP=null; }
 if(f.lastModified&&Date.now()-f.lastModified>FRESH_MS){ alert('ภาพนี้ไม่ได้ถ่ายตอนนี้ (อาจเลือกจากคลังภาพ)\nกรุณากดถ่ายใหม่จากกล้อง'); return; }
 const p=pos?Object.assign({},pos):null;
 if(x.gps){ if(!p){ alert('ไม่มีพิกัด GPS — ถ่ายใหม่หลังได้ตำแหน่ง'); return; }
  if(p.acc>ACC_MAX){ tries[cur]=(tries[cur]||0)+1; if(tries[cur]<2){ alert('GPS ยังไม่แม่น (±'+p.acc+' ม.)\nรอ 10–20 วินาที หรือออกไปที่โล่ง แล้วถ่ายใหม่'); return; } flag='acc'; } }
 try{ ov('⏳ กำลังเตรียมภาพ…'); const code=mkCode(), ts0=Date.now(); const data=await shrink(f,p,code,x.lab); ov('');
  const ch=await review(data,x); if(ch!=='use') return;   /* รุ่น 4.1: ส่งเข้าระบบเมื่อกด "ใช้ภาพนี้" เท่านั้น */

function mkCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a=new Uint8Array(4); (window.crypto||{getRandomValues:x=>x.map(()=>Math.random()*256|0)}).getRandomValues(a); let r=''; a.forEach(v=>r+=c[v%c.length]);
 const d=new Date(), ym=String((d.getFullYear()+543)%100).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0'); const br=String((D&&D.branch)||'').replace(/[^0-9A-Za-z]/g,'').toUpperCase().slice(0,4)||'00';
 return br+'-'+ym+'-'+r; }
function fmtFull(ms){ const d=new Date(ms); return d.toLocaleDateString('th-TH',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function shrink(f,p,code,lab){ return new Promise((ok,no)=>{ const u=URL.createObjectURL(f); const im=new Image(); im.onload=async()=>{ try{
  const s=Math.min(1,MAX_W/Math.max(im.width,im.height)); const W=Math.round(im.width*s), H=Math.round(im.height*s);
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d'); g.drawImage(im,0,0,W,H);
  const now=Date.now(), U=Math.min(W,H), F='"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif';
  /* 1) ลายน้ำทแยงทั้งภาพ — ตัด/ครอปมุมภาพแล้วยังเห็นเลขเคส */
  const wm='โมโต24 · '+String(D.caseId).replace(/^~/,'ร่าง ')+' · '+fmtFull(now).split(' ')[0]; const wf=Math.round(U/22);
  g.save(); g.translate(W/2,H/2); g.rotate(-Math.PI/6); g.font='bold '+wf+'px '+F; g.fillStyle='rgba(255,255,255,.16)'; g.strokeStyle='rgba(0,0,0,.10)'; g.lineWidth=Math.max(1,wf/18);
  const tw=g.measureText(wm).width+wf*3, R=Math.hypot(W,H);
  for(let y=-R;y<R;y+=wf*4.2) for(let x=-R+((y/(wf*4.2))%2?tw/2:0);x<R;x+=tw){ g.strokeText(wm,x,y); g.fillText(wm,x,y); }
  g.restore();
  /* 2) โลโก้บริษัท มุมซ้ายบน */
  const L=await logoImg(); if(L){ const lw=Math.round(U*0.26), lh=Math.round(lw*L.height/L.width), m=Math.round(U*0.025); g.globalAlpha=.92; g.drawImage(L,m,m,lw,lh); g.globalAlpha=1; }
  /* 3) แถบข้อมูลด้านล่าง 3 บรรทัด */
  const fs=Math.max(15,Math.round(U/30)), lh2=fs*1.38, bh=lh2*3+fs*0.7;
  const l1=(lab||cur)+(String(D.caseId).charAt(0)==='~'?' · ร่าง '+String(D.caseId).slice(1):' · เคส '+D.caseId)+(D.info&&D.info.br?' · '+D.info.br:'');
  const l2='เวลา '+fmtFull(now)+(p?'   📍 '+p.lat.toFixed(6)+', '+p.lng.toFixed(6)+' (±'+p.acc+' ม.)':'   📍 ไม่มีพิกัด');
  const l3='รหัสภาพ '+code+' · ถ่ายผ่านระบบ MOTO24 เท่านั้น';
  g.fillStyle='rgba(30,33,100,.82)'; g.fillRect(0,H-bh,W,bh); g.fillStyle='#ea580c'; g.fillRect(0,H-bh,W,Math.max(3,fs/5));
  g.fillStyle='#fff'; g.textBaseline='alphabetic'; const x0=fs*0.6;
  g.font='bold '+fs+'px '+F; g.fillText(l1,x0,H-bh+fs*0.35+lh2*0.95,W-x0*2);
  g.font=fs*0.92+'px '+F; g.fillText(l2,x0,H-bh+fs*0.35+lh2*1.95,W-x0*2);
  g.font='bold '+fs*0.92+'px '+F; g.fillStyle='#fdba74'; g.fillText(l3,x0,H-bh+fs*0.35+lh2*2.95,W-x0*2);
  URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg',Q)); }catch(e){ no(e); } }; im.onerror=()=>no(new Error('เปิดภาพไม่ได้')); im.src=u; }); }
/* ---------- รุ่น 4: ภาพย่อ · ดูเต็มจอ · ลบ (เฉพาะร่าง) ---------- */
async function loadThumbs(){ const ks=Object.keys(D.done||{}).filter(k=>TH[k]===undefined); let i=0;
 const one=async()=>{ while(i<ks.length){ const k=ks[i++]; try{ const r=await call({a:'th',t:T,item:k}); if(!r.ok) throw r.err; TH[k]='data:'+r.mime+';base64,'+r.b64; }catch(e){ TH[k]=false; } render(); } };
 await Promise.all([one(),one(),one()]); }
async function vwOpen(k){ const x=D.items.find(y=>y.k===k), d=(D.done||{})[k]; if(!x||!d) return;
 $('vwt').textContent=x.lab; $('vwm').textContent='ส่งแล้ว '+fmtT(d.at)+(d.code?' · รหัสภาพ '+d.code:'')+' · ซูมด้วยสองนิ้วเพื่อเช็กรายละเอียด';
 $('vwb').innerHTML=(D.canDel?'<button class="btn b-rd" onclick="vwClose();cfOpen(\''+E(k)+'\')">🗑 ลบภาพนี้</button>':'')+'<button class="btn b-o" onclick="vwClose();shoot(\''+E(k)+'\')">📷 ถ่ายใหม่แทน</button>';
 $('vw').style.display='flex'; const show=u=>{ $('vwi').innerHTML='<img src="'+u+'" alt="">'; };
 if(FULL[k]) show(FULL[k]); else { if(TH[k]) show(TH[k]); else $('vwi').innerHTML='<div class="mut">⏳ กำลังโหลดภาพ…</div>';
  try{ const r=await call({a:'th',t:T,item:k,full:1}); if(!r.ok) throw r.err; FULL[k]='data:'+r.mime+';base64,'+r.b64; if(!TH[k]){ TH[k]=FULL[k]; render(); } if($('vw').style.display==='flex') show(FULL[k]); }
  catch(e){ if(!TH[k]) $('vwi').innerHTML='<div class="mut">โหลดภาพไม่ได้: '+E(e.message||e)+'</div>'; } } }
function vwClose(){ $('vw').style.display='none'; $('vwi').innerHTML=''; }
let cfK=null;
async function cfOpen(k){ if(PD&&PD.k!==k) await delFlush(); cfK=k; const x=D.items.find(y=>y.k===k); $('cft').textContent='ลบภาพ "'+(x?x.lab:k)+'"?'; $('cf').style.display='flex'; }
function cfClose(){ $('cf').style.display='none'; cfK=null; }
function delGo(){ const k=cfK; cfClose(); if(!k||!D.done[k]) return;
 PD={k,d:D.done[k],th:TH[k],full:FULL[k],n:5,chg:D.chg}; delete D.done[k]; D.chg=Date.now(); delete TH[k]; delete FULL[k]; render();
 const x=D.items.find(y=>y.k===k); $('tst').textContent='ลบภาพ "'+(x?x.lab:'')+'" แล้ว'; $('tsn').textContent=5; $('ts').style.display='flex';
 PD.iv=setInterval(()=>{ if(!PD) return; PD.n--; $('tsn').textContent=PD.n; if(PD.n<=0) delFlush(); },1000); }
function delUndo(){ if(!PD) return; clearInterval(PD.iv); D.done[PD.k]=PD.d; D.chg=PD.chg; if(PD.th) TH[PD.k]=PD.th; if(PD.full) FULL[PD.k]=PD.full; PD=null; $('ts').style.display='none'; render(); }
async function delFlush(keep){ if(!PD) return; const p=PD; PD=null; clearInterval(p.iv); $('ts').style.display='none';
 if(keep){ try{ fetch(API,{method:'POST',body:JSON.stringify({a:'del',t:T,item:p.k}),keepalive:true}); }catch(e){} return; }
 try{ ov('⏳ กำลังลบภาพ…'); const r=await call({a:'del',t:T,item:p.k}); ov(''); if(!r.ok) throw r.err||'ลบไม่สำเร็จ'; }
 catch(e){ ov(''); D.done[p.k]=p.d; if(p.th) TH[p.k]=p.th; if(p.full) FULL[p.k]=p.full; render(); alert('ลบภาพไม่สำเร็จ: '+(e.message||e)+'\nภาพเดิมยังอยู่ในระบบ'); } }
window.addEventListener('pagehide',()=>{ if(PD&&!window.__mockApi) delFlush(true); });   // ปิดหน้าระหว่างนับถอยหลัง → ส่งคำสั่งลบไปเลย
/* รุ่น 4.1: หน้าตรวจภาพก่อนส่ง · ลบ ถ่ายใหม่ = ทิ้งภาพในเครื่อง ไม่มีอะไรไป Drive */
let _rv=null;
function review(data,x){ $('rvt').textContent=x.lab; $('rvi').innerHTML='<img src="'+data+'" alt="">';
 $('rvc').innerHTML='<b>เช็กก่อนกดใช้</b><br>☐ ภาพชัด ไม่เบลอ ไม่มืด'+(x.hint?'<br>☐ '+E(x.hint):'')+'<br>☐ ข้อความล่างภาพ (เวลา/พิกัด/รหัสภาพ) อ่านได้';
 $('rv').style.display='flex'; return new Promise(r=>{ _rv=r; }); }
function rvPick(c){ $('rv').style.display='none'; $('rvi').innerHTML=''; const r=_rv; _rv=null; if(r) r(c);
 if(c==='retake'){ $('cam').value=''; $('cam').click(); } }   // เปิดกล้องในจังหวะกดปุ่ม (เบราว์เซอร์มือถือบังคับ)
/* รุ่น 4.2: หน้าเสร็จสิ้น (บนมือถือ · ให้สาขารู้ว่าจบงานแล้ว) */
async function finOpen(){ if(PD) await delFlush(); const done=D.done||{}, dr=String(D.caseId).charAt(0)==='~';
 try{ ov('⏳ กำลังบันทึก…'); const r=await call({a:'fin',t:T}); ov(''); if(!r.ok) throw r.err; D.fin=r.fin; render(); }
 catch(e){ ov(''); alert('บันทึกสถานะเสร็จสิ้นไม่สำเร็จ: '+(e.message||e)+'\nลองกดอีกครั้ง'); return; }
 $('fint').innerHTML=(dr?'ร่างคำขอ · '+E(D.info.name||''):'เคส <b>'+E(D.caseId)+'</b> · '+E(D.info.name||''))+'<br>'+fmtT(Date.now());
 $('finl').innerHTML=D.items.map(x=>{ const d=done[x.k]; return '<div>'+(d?'✅':(x.req?'❌':'➖'))+' <b>'+E(x.lab)+'</b>'+(d?'<br><span class="mut">ส่งแล้ว '+fmtT(d.at)+(d.code?' · รหัส '+E(d.code):'')+'</span>':'<br><span class="mut">'+(x.req?'ยังไม่ถ่าย':'ไม่ได้ถ่าย (ไม่บังคับ)')+'</span>')+'</div>'; }).join('');
 $('finn').innerHTML='ภาพทั้งหมดเข้าระบบแล้ว ปิดหน้านี้ได้เลย<br>'+(dr?'<b>ขั้นต่อไป:</b> กลับไปที่ฟอร์มคำขอในเครื่อง PC แล้วกดส่งคำขอให้ สนญ.':'สนญ. จะตรวจภาพต่อ · ถ้า สนญ. ขอภาพเพิ่ม เปิดลิงก์เดิมได้');
 $('fin').style.display='flex'; window.scrollTo(0,0); }
function finClose(){ $('fin').style.display='none'; }
async function boot(){ if(!T){ $('main').innerHTML='<div class="err">ลิงก์ไม่ครบ — เปิดจาก QR หรือลิงก์ในหน้าเคสอีกครั้ง</div>'; $('hs').textContent=''; return; }
 if(/Line\//i.test(navigator.userAgent)&&!/openExternalBrowser=1/.test(location.search)){ location.replace(location.href+(location.search?'&':'?')+'openExternalBrowser=1'); return; }
 gpsStart();
 try{ const r=await call({a:'get',t:T}); if(!r.ok) throw r.err; D=r; render(); loadThumbs(); }
 catch(e){ $('hs').textContent=''; $('main').innerHTML='<div class="err">⚠ '+E(e.message||e)+'</div>'; } }
boot();
</script>
